<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo de Batata: una batata morada (como su piel real) con un rayo de energía. -->
  <defs>
    <radialGradient id="aurora1" cx="0.2" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="0.9" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="brillo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brillo-rayo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0d0a24"/>
  <rect width="512" height="512" rx="112" fill="url(#aurora1)"/>
  <rect width="512" height="512" rx="112" fill="url(#aurora2)"/>

  <g transform="translate(256 276) rotate(-35)">
    <!-- hojitas en la punta -->
    <path d="M168 -14 C 190 -70, 240 -78, 262 -60 C 240 -30, 205 -12, 168 -14 Z" fill="url(#hoja)"/>
    <path d="M170 -4 C 215 -10, 250 20, 252 46 C 215 44, 182 22, 170 -4 Z" fill="url(#hoja)" opacity="0.9"/>
    <!-- la batata -->
    <path d="M-192 14 C -160 -58, -70 -100, 30 -96 C 110 -93, 160 -50, 182 -8 C 160 46, 100 96, 10 98 C -80 100, -160 66, -192 14 Z"
          fill="url(#piel)" filter="url(#brillo)"/>
    <!-- vetas de la piel -->
    <path d="M-120 -40 C -100 -48, -80 -50, -62 -48" stroke="#fbcfe8" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M60 70 C 85 66, 105 58, 120 46" stroke="#1e1b4b" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M-150 30 C -135 44, -118 52, -98 56" stroke="#1e1b4b" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- el rayo: la energía que ahorras -->
  <g transform="translate(184 197) scale(6.2)" filter="url(#brillo-rayo)">
    <path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#ffe066" stroke="#fff7c2" stroke-width="0.6" stroke-linejoin="round"/>
  </g>
</svg>
