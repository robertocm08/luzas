# Ejecuta las pruebas automáticas en cada cambio (en cualquier rama y en cada pull request).
# Si algo se rompe, verás una ❌ roja junto al cambio en GitHub.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
